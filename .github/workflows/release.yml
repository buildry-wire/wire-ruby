name: release
on:
  push:
    tags: ["v*"]
permissions:
  id-token: write   # OIDC trusted publishing to RubyGems.org
  contents: write   # create the GitHub Release
jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Verify tag matches gem version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(ruby -r ./lib/wire/version.rb -e 'print Wire::VERSION')"
          echo "tag=$TAG gem=$VER"
          test "$TAG" = "$VER" || { echo "tag/version mismatch"; exit 1; }
      - run: bundle exec rake test
      - name: build gem
        run: gem build wirepayment.gemspec
      # OIDC trusted publishing: no long-lived RUBYGEMS_API_KEY needed.
      # The trusted publisher must be registered on rubygems.org first
      # (see RELEASING.md).
      - name: Configure RubyGems OIDC credentials
        uses: rubygems/configure-rubygems-credentials@v1.0.0
      - name: Publish to RubyGems
        run: gem push wirepayment-*.gem
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: wirepayment-*.gem
